name: 毎日のSNS自動投稿

on:
  schedule:
    # UTC 22:00 = 日本時間(JST) 翌7:00。実行時刻を変更する場合はJSTから9時間引いた時刻をUTCで指定すること。
    # GitHubの仕様上、スケジュール実行の開始時刻は数分〜数十分ずれることがある（保証された時刻ではない）。
    - cron: "0 22 * * *"
  workflow_dispatch: {} # 手動実行・失敗時の再実行用

permissions:
  contents: write # 投稿履歴・公開用画像をリポジトリへコミットするために必要

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: ユニットテストを実行
        run: PYTHONPATH=admin pytest -q

      - name: 本日の投稿を実行
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}

          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}

          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_POST_MODE: ${{ vars.FACEBOOK_POST_MODE }}

          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_BUSINESS_ACCOUNT_ID: ${{ vars.GOOGLE_BUSINESS_ACCOUNT_ID }}
          GOOGLE_BUSINESS_LOCATION_ID: ${{ vars.GOOGLE_BUSINESS_LOCATION_ID }}

          # 審査が承認されるまでは未設定のままにしておく（未設定 = 無効 = dry-run）。
          # 承認後は Settings > Secrets and variables > Actions > Variables で true に変更するだけでよい。
          ENABLE_X: ${{ vars.ENABLE_X || 'true' }}
          ENABLE_INSTAGRAM: ${{ vars.ENABLE_INSTAGRAM }}
          ENABLE_FACEBOOK: ${{ vars.ENABLE_FACEBOOK }}
          ENABLE_GOOGLE_BUSINESS: ${{ vars.ENABLE_GOOGLE_BUSINESS }}

          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          PYTHONPATH=admin python scripts/run_daily_post.py

      - name: 投稿履歴の変更をコミット
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/post_history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: 投稿履歴を更新 (run ${{ github.run_id }})"
            git push
          else
            echo "投稿履歴に変更はありませんでした。"
          fi
