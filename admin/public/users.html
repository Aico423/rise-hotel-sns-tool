<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ユーザー管理 | RISE HOTEL SNS投稿ツール</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>RISE HOTEL SNS投稿ツール</h1>
    <p>ユーザー管理</p>
  </header>
  <main>
    <nav class="tabs" id="nav-tabs">
      <a href="index.html">一覧にもどる</a>
      <a href="materials.html">写真を登録する</a>
      <a href="texts.html">文言を登録する</a>
      <a href="decorations.html">スタンプを登録する</a>
      <a href="preview.html">プレビュー</a>
      <a href="room-types.html">部屋タイプの設定</a>
      <a href="text-style.html">文字の装飾の設定</a>
      <a href="post-status.html">投稿状況</a>
      <a href="users.html" class="active">ユーザー管理</a>
      <a href="#" id="logout-link">ログアウト</a>
    </nav>

    <div id="message" class="message hidden"></div>

    <section class="card">
      <h2>新しいユーザーを追加する</h2>
      <form id="user-form">
        <div class="field">
          <label class="field-label" for="new-email">メールアドレス</label>
          <input type="text" id="new-email" placeholder="例：staff@rise-hotel.com" />
        </div>
        <div class="field">
          <label class="field-label" for="new-password">パスワード（8文字以上）</label>
          <input type="password" id="new-password" autocomplete="new-password" />
        </div>
        <div class="field">
          <label class="field-label" for="new-role">権限</label>
          <select id="new-role">
            <option value="user">スタッフ（写真・文言の登録のみ）</option>
            <option value="admin">管理者（ユーザー管理も可能）</option>
          </select>
        </div>
        <div class="button-row">
          <button type="submit" id="submit-btn">追加する</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>登録済みのユーザー</h2>
      <div id="users-list" class="loading">読み込み中です…</div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/checkbox-group.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
