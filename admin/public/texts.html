<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>文言を登録 | RISE HOTEL SNS投稿ツール</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>RISE HOTEL SNS投稿ツール</h1>
    <p>投稿文言・キーワードの登録</p>
  </header>
  <main>
    <nav class="tabs">
      <a href="index.html">一覧にもどる</a>
      <a href="materials.html">写真を登録する</a>
      <a href="texts.html" class="active">文言を登録する</a>
    </nav>

    <section class="card">
      <h2>新しい投稿文言・キーワードを登録する</h2>
      <div id="message" class="message hidden"></div>

      <form id="text-form">
        <div class="field">
          <label class="field-label" for="text-body">投稿に使いたい文言・キーワード</label>
          <textarea id="text-body" placeholder="例：夜景が自慢のお部屋で、特別な夜をお過ごしください"></textarea>
        </div>

        <div class="field">
          <label class="field-label" for="category">カテゴリ</label>
          <select id="category"></select>
        </div>

        <div class="field">
          <label class="field-label">どのSNSに使いますか？</label>
          <div id="platforms-checkboxes" class="checkbox-grid"></div>
        </div>

        <div class="button-row">
          <button type="submit" id="submit-btn">保存する</button>
          <a href="index.html" class="btn secondary">キャンセル</a>
        </div>
      </form>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/checkbox-group.js"></script>
  <script src="js/texts.js"></script>
</body>
</html>
