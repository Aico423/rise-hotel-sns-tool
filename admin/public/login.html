<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ログイン | RISE HOTEL SNS投稿ツール</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>RISE HOTEL SNS投稿ツール</h1>
    <p>管理画面</p>
  </header>
  <main class="login-main">
    <section class="card login-card">
      <h2 id="form-title">ログイン</h2>
      <p id="form-hint" class="hint-text"></p>
      <div id="message" class="message hidden"></div>

      <form id="login-form">
        <div class="field">
          <label class="field-label" for="email">メールアドレス</label>
          <input type="text" id="email" autocomplete="username" placeholder="例：staff@rise-hotel.com" />
        </div>

        <div class="field">
          <label class="field-label" for="password">パスワード</label>
          <input type="password" id="password" autocomplete="current-password" />
        </div>

        <div class="button-row">
          <button type="submit" id="submit-btn">ログイン</button>
        </div>
      </form>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/checkbox-group.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
