<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>写真を登録 | RISE HOTEL SNS投稿ツール</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>RISE HOTEL SNS投稿ツール</h1>
    <p>客室写真の登録</p>
  </header>
  <main>
    <nav class="tabs">
      <a href="index.html">一覧にもどる</a>
      <a href="materials.html" class="active">写真を登録する</a>
      <a href="texts.html">文言を登録する</a>
      <a href="decorations.html">スタンプを登録する</a>
      <a href="preview.html">プレビュー</a>
      <a href="room-types.html">部屋タイプの設定</a>
      <a href="text-style.html">文字の装飾の設定</a>
      <a href="post-status.html">投稿状況</a>
      <a href="users.html">ユーザー管理</a>
      <a href="#" id="logout-link">ログアウト</a>
    </nav>

    <section class="card">
      <h2>新しい客室写真を登録する</h2>
      <div id="message" class="message hidden"></div>

      <form id="material-form">
        <div class="field">
          <label class="field-label">写真</label>
          <div id="dropzone" class="dropzone">
            <p>ここに写真をドラッグ＆ドロップ<br />または</p>
            <button type="button" id="pick-file-btn" class="secondary">写真を選ぶ</button>
            <input type="file" id="file-input" accept="image/*" style="display:none" />
            <img id="preview" class="preview" style="display:none" />
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="room-type">部屋タイプ</label>
          <select id="room-type"></select>
          <p id="room-type-detail" class="hint-text"></p>
        </div>

        <div class="field">
          <label class="field-label" for="room-number">部屋番号（任意）</label>
          <input type="text" id="room-number" placeholder="例：601" />
        </div>

        <div class="field">
          <label class="field-label">季節</label>
          <div id="seasons-checkboxes" class="checkbox-grid"></div>
        </div>

        <div class="field">
          <label class="checkbox-pill" for="ready-made-checkbox">
            <input type="checkbox" id="ready-made-checkbox" />
            <span>この写真はすでに人物が入った完成写真です</span>
          </label>
          <p class="hint-text">
            チェックすると、この写真はそのまま使われます（AIによる人物の自動合成は行いません）。
            チェックしない場合は、投稿のたびにAIが人物を合成します。
          </p>
        </div>

        <div class="button-row">
          <button type="submit" id="submit-btn">保存する</button>
          <a href="index.html" class="btn secondary">キャンセル</a>
        </div>
      </form>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/image-compress.js"></script>
  <script src="js/checkbox-group.js"></script>
  <script src="js/materials.js"></script>
</body>
</html>
